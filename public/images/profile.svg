<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
    <title id="title">Portrait placeholder for Janray Dave T. Bataller</title>
    <desc id="desc">A dark gradient panel with the initials JB.</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1220"/>
            <stop offset="1" stop-color="#05070d"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a7f3d0"/>
            <stop offset="0.5" stop-color="#6ee7b7"/>
            <stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="35%" r="65%">
            <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="640" height="640" fill="url(#bg)"/>
    <rect width="640" height="640" fill="url(#grid)"/>
    <circle cx="320" cy="240" r="280" fill="url(#glow)"/>

    <circle cx="110" cy="120" r="4" fill="#6ee7b7" opacity="0.8"/>
    <circle cx="540" cy="180" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="480" cy="500" r="4" fill="#a78bfa" opacity="0.7"/>
    <circle cx="150" cy="520" r="3" fill="#6ee7b7" opacity="0.6"/>

    <g transform="translate(320 300)">
        <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <circle r="145" fill="none" stroke="#6ee7b7" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 10"/>
        <text text-anchor="middle" y="46" font-family="Sora, Inter, Segoe UI, sans-serif" font-size="150" font-weight="700" fill="url(#accent)" letter-spacing="-6">JB</text>
    </g>

    <g transform="translate(320 545)">
        <rect x="-122" y="-26" width="244" height="52" rx="26" fill="#0b1220" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.1"/>
        <circle cx="-96" cy="0" r="5" fill="#6ee7b7"/>
        <text x="-80" y="6" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0" letter-spacing="1.5">BSIT · 4TH YEAR</text>
    </g>
</svg>
